# Builds the iOS app on a macOS runner, signs it with your existing match certificates and
# uploads it to TestFlight. ios/ is not committed: it is generated fresh on every run.
# Secrets are listed in README.md. Nothing is committed back to the repository.
name: iOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Refuse preview builds
        run: node scripts/release-guard.cjs --platform ios --stage workflow

      - name: Install dependencies
        run: npm ci

      - name: Assemble the web assets
        run: npm run web

      - name: Generate the Xcode project
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Apply the starter's iOS customizations
        run: npm run ios:prepare

      - name: Generate icons and splash screens
        run: npm run assets -- --ios

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build, sign and upload to TestFlight
        run: bundle exec fastlane ios release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
