# Builds a signed Android App Bundle on an Ubuntu runner and uploads it to the Play internal
# track. Upload the first bundle by hand in the Play Console before running this (README.md).
# Secrets are listed in README.md. Nothing is committed back to the repository.
name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  internal-track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Refuse preview builds
        run: node scripts/release-guard.cjs --platform android --stage workflow

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Read the application id
        id: starter
        run: echo "appId=$(node -p "require('./starter.config.json').appId")" >> "$GITHUB_OUTPUT"

      - name: Assemble the web assets
        run: npm run web

      - name: Sync Android
        run: npx cap sync android

      - name: Generate icons and splash screens
        run: npm run assets -- --android

      - name: Restore the upload keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build the signed App Bundle
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Upload to the internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.starter.outputs.appId }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
